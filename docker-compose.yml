services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - STORAGE_DIR=/tmp/fileprocessor_storage
      - PDF_WORKERS=4
      - IMAGE_WORKERS=8
      - MAX_CONCURRENT_JOBS=12
      - FILE_RETENTION_MINS=60
    volumes:
      - fileprocessor_temp:/tmp/fileprocessor_storage
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  fileprocessor_temp:
